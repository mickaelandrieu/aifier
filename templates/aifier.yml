# generated by aifier init
project: {{project}}
forge: {{forge}}
repo: {{repo}}
language: {{language}}
engines: [{{engines}}]
branches:
  default: {{default_branch}}
  target: {{target_branch}}
labels:
  prefix: "{{label_prefix}}"
  states: [todo, in-progress, done, partial, needs-input]
  pr_states: [ok, need-work, rejected]
areas:
{{#areas}}  {{dir}}: { guide: {{dir}}/AGENTS.md, stack: {{stack}} }
{{/areas}}
gates:
{{#areas}}  {{dir}}:
    lint: {{gates.lint}}
    typecheck: {{gates.typecheck}}
    test: {{gates.test}}
    build: {{gates.build}}
{{/areas}}
preflight: []
ci:
  file: {{ci_file}}
  required_checks: [{{required_checks}}]
guards: [{{guards}}]
protected_paths: [{{protected_paths}}]
memory:
  rules: docs/learned-rules.md
  decisions: docs/decisions
  handoff: docs/handoff.md
