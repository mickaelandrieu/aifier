# generated by aifier init (rendered by the engine on 2026-10-07)
project: aifier
forge: github
repo: mickaelandrieu/aifier
language: en
engines: [claude-code, opencode, pi]
branches:
  default: main
  target: main
labels:
  prefix: "sdlc"
  states: [todo, in-progress, done, partial, needs-input]
  pr_states: [ok, need-work, rejected]
areas:
  root: { guide: AGENTS.md, stack: docs }
gates:
  root:
    lint: "cargo fmt --check && cargo clippy --all-targets -- -D warnings && bash tests/lint.sh"
    typecheck: "cargo test"
    test: "AIFIER_SRC=. AIFIER_REF=main AIFIER_DIR=skills sh install.sh && bash skills/init/detect.sh . >/dev/null && bash skills/assess/probes.sh . >/dev/null && bash tests/run.sh"
    build: "cargo build --release"
preflight: ["test -f Cargo.toml", "command -v cargo", "command -v jq"]
ci:
  file: .github/workflows/check.yml
  required_checks: [check]
guards: []
memory:
  rules: docs/learned-rules.md
  decisions: docs/decisions
  handoff: docs/handoff.md
protected_paths: [templates/, skills/*/SKILL.md]
