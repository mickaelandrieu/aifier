name: release
# One tag of this repository is one release carrying the aifier binary for four targets (ADR 0002).
# install.sh downloads aifier-<tag>-<target>.tar.gz and checks it against SHA256SUMS.
on:
  push:
    tags: ["v[0-9]*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, runner: macos-latest }
          - { target: aarch64-apple-darwin, runner: macos-latest }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: smoke the binary against the golden trees
        if: matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-apple-darwin'
        run: AIFIER_BIN=target/${{ matrix.target }}/release/aifier bash tests/run.sh
      - name: package
        run: |
          asset="aifier-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
          tar -C "target/${{ matrix.target }}/release" -czf "$asset" aifier
          echo "ASSET=$asset" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with: { name: "${{ matrix.target }}", path: "${{ env.ASSET }}", if-no-files-found: error }
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: assets, merge-multiple: true }
      - name: checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd assets && sha256sum aifier-*.tar.gz > SHA256SUMS && cat SHA256SUMS && cd ..
          gh release create "$GITHUB_REF_NAME" --title "aifier $GITHUB_REF_NAME" --generate-notes assets/* \
            || gh release upload "$GITHUB_REF_NAME" assets/* --clobber
