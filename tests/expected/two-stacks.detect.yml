# draft generated by aifier init detection on DATE; review before confirming
project: two-stacks
forge: unknown
repo: acme/two-stacks
language: en
engines: [claude-code]
branches:
  default: main
  target: main
labels:
  prefix: "sdlc"
  states: [todo, in-progress, done, partial, needs-input]
  pr_states: [ok, need-work, rejected]
areas:
  api: { guide: api/AGENTS.md, stack: python-fastapi }
  web: { guide: web/AGENTS.md, stack: node }
gates:
  api:
    lint: "ruff check . && ruff format --check ."
    typecheck: "mypy ."
    test: "pytest"
    build: null
  web:
    lint: "npm run lint"
    typecheck: "npm run typecheck"
    test: null
    build: "npm run build"
ci:
  file: .github/workflows/ci.yml
  required_checks: []
guards: []
protected_paths: []
memory:
  rules: docs/learned-rules.md
  decisions: docs/decisions
  handoff: docs/handoff.md
existing:
  - CLAUDE.md
  - .github/ISSUE_TEMPLATE
  - docs/decisions
