[package]
name = "aifier"
version = "0.1.0"
edition = "2021"
description = "aifier binary (V2): renders the files init puts into a repository; update and remove come next"
license = "MIT"
repository = "https://github.com/mickaelandrieu/aifier"
publish = false

[[bin]]
name = "aifier"
path = "src/main.rs"

[dependencies]
serde_yaml = "0.9.34"
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
